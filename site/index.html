<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>地下鉄学習マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <select id="city" aria-label="都市"></select>
  <div class="group" role="group" aria-label="表示範囲">
    <button id="btn-focus" type="button">主要エリア</button>
    <button id="btn-all" type="button">全域</button>
  </div>
  <label class="field">駅名
    <select id="label-mode" aria-label="駅名ラベル">
      <option value="ja">日本漢字</option>
      <option value="orig">原表記</option>
      <option value="both">両方</option>
      <option value="none">なし</option>
    </select>
  </label>
  <label class="field">地図
    <select id="basemap" aria-label="背景地図">
      <option value="plain">淡色（ラベルなし）</option>
      <option value="osm">標準（ラベルあり）</option>
    </select>
  </label>
  <button id="btn-legend" type="button" aria-expanded="true" aria-controls="legend">路線</button>
</header>
<main id="map" aria-label="地図"></main>
<aside id="legend" aria-label="路線の凡例">
  <div class="legend-head">
    <span>路線</span>
    <span class="legend-actions">
      <button type="button" data-all="on">全表示</button>
      <button type="button" data-all="off">全非表示</button>
    </span>
  </div>
  <ul id="legend-list"></ul>
  <div class="legend-note"><span class="dot unverified"></span>薄い点は表記・読みが未確認の駅</div>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
